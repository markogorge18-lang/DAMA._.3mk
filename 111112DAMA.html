<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>DAMA code</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #fff;
            --tx: #161a2b;
            --mu: #667;
            --pr: #5b3df5;
            --ok: #0a8f4e;
            --bad: #d1293d;
            --bd: #e2e4ee;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1220;
                --card: #181c30;
                --tx: #eef0fa;
                --mu: #9aa0bd;
                --pr: #8b73ff;
                --ok: #38d27f;
                --bad: #ff6b7d;
                --bd: #2a2f4a
            }
        }

        :root[data-theme="dark"] {
            --bg: #0f1220;
            --card: #181c30;
            --tx: #eef0fa;
            --mu: #9aa0bd;
            --pr: #8b73ff;
            --ok: #38d27f;
            --bad: #ff6b7d;
            --bd: #2a2f4a
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font-family: Tahoma, "Segoe UI", Arial, sans-serif;
            line-height: 1.8
        }

        .w {
            max-width: 720px;
            margin: auto;
            padding: 44px 16px 16px
        }

        h1 {
            margin: 0;
            font-size: 26px
        }

        h1 span {
            color: var(--pr)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 16px;
            margin: 12px 0
        }

        button {
            background: var(--pr);
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            font: inherit;
            cursor: pointer;
            margin: 4px 0
        }

        button.g {
            background: transparent;
            color: var(--pr);
            border: 1px solid var(--pr)
        }

        button:disabled {
            opacity: .4
        }

        input,
        select,
        textarea {
            width: 100%;
            background: var(--bg);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 10px;
            font: inherit
        }

        textarea {
            min-height: 170px;
            direction: ltr;
            text-align: left;
            font-family: monospace
        }

        pre {
            direction: ltr;
            text-align: left;
            background: var(--bg);
            padding: 10px;
            border-radius: 10px;
            overflow-x: auto
        }

        .l {
            display: block;
            padding: 10px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            margin: 6px 0;
            cursor: pointer
        }

        .l.s {
            border-color: var(--pr)
        }

        .ok {
            color: var(--ok)
        }

        .bad {
            color: var(--bad)
        }

        .mu {
            color: var(--mu);
            font-size: 14px
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .bar {
            height: 8px;
            background: var(--bd);
            border-radius: 9px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--pr)
        }

        .theme-switch {
            --toggle-size: 11px;
            --container-width: 5.625em;
            --container-height: 2.5em;
            --container-radius: .38em;
            --container-light-bg: #5caad4;
            --container-night-bg: #1b1e36;
            --circle-container-diameter: 3.375em;
            --sun-moon-diameter: 2.125em;
            --sun-bg: #f5c518;
            --moon-bg: #d8d4c0;
            --spot-color: #9b9787;
            --circle-container-offset: calc((var(--circle-container-diameter) - var(--container-height))/2*-1);
            --stars-color: #fff8e1;
            --clouds-color: #f4f4f4;
            --back-clouds-color: #bacfe0;
            --transition: .5s cubic-bezier(0, -.02, .4, 1.25);
            --circle-transition: .3s cubic-bezier(0, -.02, .35, 1.17);
            display: inline-block;
            direction: ltr;
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            left: 14px;
            z-index: 9
        }

        .theme-switch,
        .theme-switch *,
        .theme-switch *::before,
        .theme-switch *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-size: var(--toggle-size)
        }

        .theme-switch__container {
            width: var(--container-width);
            height: var(--container-height);
            background-color: var(--container-light-bg);
            border-radius: var(--container-radius);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background-image: linear-gradient(to bottom, var(--container-light-bg) 0%, #4a92bd 100%);
            transition: all var(--transition);
            box-shadow: 0 0 0 2.5px #1a1a1a, 3px 4px 0 2.5px rgba(26, 26, 26, .22);
            transform: rotate(-.7deg);
            filter: url(#sketchy)
        }

        .theme-switch__container::before {
            content: "";
            position: absolute;
            z-index: 1;
            inset: 0;
            background-image: repeating-linear-gradient(-50deg, transparent, transparent 7px, rgba(255, 255, 255, .04) 7px, rgba(255, 255, 255, .04) 8px);
            border-radius: inherit;
            pointer-events: none
        }

        .theme-switch__checkbox {
            display: none
        }

        .theme-switch__circle-container {
            width: var(--circle-container-diameter);
            height: var(--circle-container-diameter);
            background-color: rgba(255, 255, 255, .1);
            position: absolute;
            left: var(--circle-container-offset);
            top: var(--circle-container-offset);
            border-radius: var(--container-radius);
            box-shadow: inset 0 0 0 3.375em rgba(255, 255, 255, .1), inset 0 0 0 3.375em rgba(255, 255, 255, .1), 0 0 0 .625em rgba(255, 255, 255, .1), 0 0 0 1.25em rgba(255, 255, 255, .1);
            display: flex;
            transition: var(--circle-transition);
            pointer-events: none
        }

        .theme-switch__circle-container::before {
            content: "";
            position: absolute;
            width: calc(var(--circle-container-diameter) + 1.5em);
            height: calc(var(--circle-container-diameter) + 1.5em);
            left: -.75em;
            top: -.75em;
            border-radius: 50%;
            background: conic-gradient(transparent 0deg, transparent 8deg, rgba(245, 197, 24, .52) 8deg, rgba(245, 197, 24, .52) 22deg, transparent 22deg, transparent 53deg, rgba(245, 197, 24, .52) 53deg, rgba(245, 197, 24, .52) 67deg, transparent 67deg, transparent 98deg, rgba(245, 197, 24, .52) 98deg, rgba(245, 197, 24, .52) 112deg, transparent 112deg, transparent 143deg, rgba(245, 197, 24, .52) 143deg, rgba(245, 197, 24, .52) 157deg, transparent 157deg, transparent 188deg, rgba(245, 197, 24, .52) 188deg, rgba(245, 197, 24, .52) 202deg, transparent 202deg, transparent 233deg, rgba(245, 197, 24, .52) 233deg, rgba(245, 197, 24, .52) 247deg, transparent 247deg, transparent 278deg, rgba(245, 197, 24, .52) 278deg, rgba(245, 197, 24, .52) 292deg, transparent 292deg, transparent 323deg, rgba(245, 197, 24, .52) 323deg, rgba(245, 197, 24, .52) 337deg, transparent 337deg, transparent 368deg, rgba(245, 197, 24, .52) 368deg, rgba(245, 197, 24, .52) 382deg, transparent 382deg, transparent 413deg, rgba(245, 197, 24, .52) 413deg, rgba(245, 197, 24, .52) 427deg, transparent 360deg);
            animation: rotateSunRays 14s linear infinite;
            opacity: 1;
            transition: opacity var(--transition);
            pointer-events: none;
            filter: url(#sketchy-sm)
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__circle-container::before {
            opacity: 0
        }

        @keyframes rotateSunRays {
            to {
                transform: rotate(360deg)
            }
        }

        .theme-switch__sun-moon-container {
            pointer-events: auto;
            position: relative;
            z-index: 2;
            width: var(--sun-moon-diameter);
            height: var(--sun-moon-diameter);
            margin: auto;
            border-radius: var(--container-radius);
            background-color: var(--sun-bg);
            box-shadow: .062em .062em .062em 0 rgba(254, 255, 239, .61) inset, 0 -.062em .062em 0 #a1872a inset, .1em .13em 0 .04em #1a1a1a;
            filter: url(#sketchy-sm) drop-shadow(.062em .125em .125em rgba(0, 0, 0, .25)) drop-shadow(0 .062em .125em rgba(0, 0, 0, .25));
            overflow: hidden;
            transition: var(--transition);
            transform: scale(1)
        }

        .theme-switch__sun-moon-container:hover {
            transform: scale(1.1) rotate(5deg)
        }

        .theme-switch__moon {
            transform: translateX(100%);
            width: 100%;
            height: 100%;
            background-color: var(--moon-bg);
            border-radius: inherit;
            box-shadow: .062em .062em .062em 0 rgba(254, 255, 239, .61) inset, 0 -.062em .062em 0 #969696 inset;
            transition: all var(--transition), transform .3s ease;
            position: relative
        }

        .theme-switch__moon:hover {
            transform: rotate(15deg)
        }

        .theme-switch__spot {
            position: absolute;
            top: .75em;
            left: .312em;
            width: .75em;
            height: .75em;
            border-radius: var(--container-radius);
            background-color: var(--spot-color);
            box-shadow: 0 .0312em .062em rgba(0, 0, 0, .25) inset;
            transition: background-color .3s ease;
            filter: url(#sketchy-sm)
        }

        .theme-switch__spot:nth-of-type(2) {
            width: .375em;
            height: .375em;
            top: .937em;
            left: 1.375em
        }

        .theme-switch__spot:nth-last-of-type(3) {
            width: .25em;
            height: .25em;
            top: .312em;
            left: .812em
        }

        .theme-switch__moon:hover .theme-switch__spot {
            background-color: #7a7f8c
        }

        .theme-switch__clouds {
            width: 1.25em;
            height: 1.25em;
            background-color: var(--clouds-color);
            border-radius: var(--container-radius);
            position: absolute;
            bottom: -.625em;
            left: .312em;
            box-shadow: .937em .312em var(--clouds-color), -.312em -.312em var(--back-clouds-color), 1.437em .375em var(--clouds-color), .5em -.125em var(--back-clouds-color), 2.187em 0 var(--clouds-color), 1.25em -.062em var(--back-clouds-color), 2.937em .312em var(--clouds-color), 2em -.312em var(--back-clouds-color), 3.625em -.062em var(--clouds-color), 2.625em 0 var(--back-clouds-color), 4.5em -.312em var(--clouds-color), 3.375em -.437em var(--back-clouds-color), 4.625em -1.75em 0 .437em var(--clouds-color), 4em -.625em var(--back-clouds-color), 4.125em -2.125em 0 .437em var(--back-clouds-color);
            transition: .5s cubic-bezier(0, -.02, .4, 1.25);
            filter: url(#sketchy-sm)
        }

        .theme-switch__stars-container {
            position: absolute;
            color: var(--stars-color);
            top: -100%;
            left: .312em;
            width: 2.75em;
            height: auto;
            transition: var(--transition)
        }

        .theme-switch__checkbox:checked+.theme-switch__container {
            background-color: var(--container-night-bg);
            background-image: linear-gradient(to bottom, var(--container-night-bg) 0%, #252a4a 100%)
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__circle-container {
            left: calc(100% - var(--circle-container-offset) - var(--circle-container-diameter))
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__circle-container:hover {
            left: calc(100% - var(--circle-container-offset) - var(--circle-container-diameter) - .187em)
        }

        .theme-switch__circle-container:hover {
            left: calc(var(--circle-container-offset) + .187em)
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__moon {
            transform: translate(0)
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__clouds {
            bottom: -4.062em
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__stars-container {
            top: 50%;
            transform: translateY(-50%)
        }

        .theme-switch__container:hover .theme-switch__clouds {
            transform: translateX(15px) scale(1.02)
        }

        .theme-switch__sun-moon-container::after {
            content: "";
            position: absolute;
            inset: -5px;
            background: radial-gradient(circle, rgba(255, 255, 255, .2) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity .3s ease
        }

        .theme-switch__sun-moon-container:hover::after {
            opacity: 1
        }

        .theme-switch__shooting-star,
        .theme-switch__shooting-star-2,
        .theme-switch__meteor {
            position: absolute;
            background: #fff;
            opacity: 0;
            transition: opacity .3s ease;
            left: -10%
        }

        .theme-switch__shooting-star {
            width: 2px;
            height: 2px;
            top: 20%
        }

        .theme-switch__shooting-star-2 {
            width: 1px;
            height: 1px;
            top: 35%
        }

        .theme-switch__meteor {
            width: 3px;
            height: 3px;
            background: gold;
            border-radius: 50%;
            top: -10%;
            left: 50%;
            filter: blur(1px)
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__shooting-star {
            animation: shootingStar 2s linear infinite;
            opacity: 1
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__shooting-star-2 {
            animation: shootingStar 3s linear infinite 1s;
            opacity: 1
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__meteor {
            animation: meteor 4s linear infinite 2s;
            opacity: 1
        }

        @keyframes shootingStar {
            0% {
                transform: translate(0, 0) rotate(45deg);
                opacity: 1
            }

            100% {
                transform: translate(150px, 150px) rotate(45deg);
                opacity: 0
            }
        }

        @keyframes meteor {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1
            }

            100% {
                transform: translateY(150px) scale(.3);
                opacity: 0
            }
        }

        .theme-switch__stars-cluster {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity .3s ease
        }

        .theme-switch__stars-cluster .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px 1px #fff
        }

        .theme-switch__stars-cluster .star:nth-child(1) {
            top: 20%;
            left: 20%;
            animation: twinkle 1s infinite ease-in-out
        }

        .theme-switch__stars-cluster .star:nth-child(2) {
            top: 30%;
            left: 55%;
            animation: twinkle 1s infinite ease-in-out .3s
        }

        .theme-switch__stars-cluster .star:nth-child(3) {
            top: 40%;
            left: 80%;
            animation: twinkle 1s infinite ease-in-out .6s
        }

        .theme-switch__stars-cluster .star:nth-child(4) {
            top: 60%;
            left: 30%;
            animation: twinkle 1s infinite ease-in-out .9s
        }

        .theme-switch__stars-cluster .star:nth-child(5) {
            top: 70%;
            left: 65%;
            animation: twinkle 1s infinite ease-in-out 1.2s
        }

        .theme-switch__aurora {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(90deg, rgba(0, 255, 255, 0) 0%, rgba(0, 255, 255, .2) 25%, rgba(128, 0, 255, .2) 50%, rgba(0, 255, 255, .2) 75%, rgba(0, 255, 255, 0) 100%);
            opacity: 0;
            filter: blur(4px);
            transform: translateY(-100%);
            transition: opacity .3s ease
        }

        .theme-switch__comets {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0;
            transition: opacity .3s ease
        }

        .theme-switch__comets .comet {
            position: absolute;
            width: 2px;
            height: 2px;
            background: linear-gradient(90deg, #fff 0%, transparent 90%);
            border-radius: 50%;
            filter: blur(1px);
            left: -10%
        }

        .theme-switch__comets .comet:nth-child(1) {
            top: 30%;
            animation: cometMove 4s linear infinite
        }

        .theme-switch__comets .comet:nth-child(2) {
            top: 50%;
            animation: cometMove 6s linear infinite 2s
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .3;
                transform: scale(1)
            }

            50% {
                opacity: 1;
                transform: scale(1.2)
            }
        }

        @keyframes cometMove {
            0% {
                transform: translate(0, 0) rotate(-45deg) scale(1);
                opacity: 0
            }

            10%,
            90% {
                opacity: 1
            }

            100% {
                transform: translate(200px, 200px) rotate(-45deg) scale(.2);
                opacity: 0
            }
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__stars-cluster,
        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__comets {
            opacity: 1
        }

        .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__aurora {
            opacity: 1;
            animation: auroraWave 8s linear infinite
        }

        @keyframes auroraWave {
            0% {
                transform: translateY(-100%) translateX(-50%)
            }

            100% {
                transform: translateY(-100%) translateX(50%)
            }
        }

        button.fx {
            position: relative;
            width: 11em;
            height: 4em;
            outline: none;
            transition: .1s;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            margin: 14px 8px;
            font-size: 13px;
            font-weight: bold;
            color: var(--tx);
            direction: ltr;
            cursor: pointer
        }

        .fx:disabled {
            pointer-events: none;
            opacity: .4
        }

        .fx .clip {
            --color: #2761c3;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            border: 5px double var(--color);
            box-shadow: inset 0 0 15px #195480;
            -webkit-clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%)
        }

        .fx .arrow {
            position: absolute;
            transition: .2s;
            background-color: #2761c3;
            top: 35%;
            width: 11%;
            height: 30%
        }

        .fx .lA {
            left: -13.5%;
            -webkit-clip-path: polygon(100% 0, 100% 100%, 0 50%);
            clip-path: polygon(100% 0, 100% 100%, 0 50%)
        }

        .fx .rA {
            -webkit-clip-path: polygon(100% 49%, 0 0, 0 100%);
            clip-path: polygon(100% 49%, 0 0, 0 100%);
            left: 102%
        }

        .fx:hover .rA {
            background-color: #27c39f;
            left: -15%;
            animation: .6s ease-in-out both infinite alternate rightArrow8
        }

        .fx:hover .lA {
            background-color: #27c39f;
            left: 103%;
            animation: .6s ease-in-out both infinite alternate leftArrow8
        }

        .fx .corner {
            position: absolute;
            width: 4em;
            height: 4em;
            background-color: #2761c3;
            box-shadow: inset 1px 1px 8px #2781c3;
            transform: scale(1) rotate(45deg);
            transition: .2s
        }

        .fx .rT {
            top: -1.98em;
            left: 91%
        }

        .fx .lT {
            top: -1.96em;
            left: -3em
        }

        .fx .lB {
            top: 2.1em;
            left: -2.15em
        }

        .fx .rB {
            top: 45%;
            left: 88%
        }

        .fx:hover .lT {
            animation: .1s ease-in-out .05s both changeColor8, .2s linear .4s both lightEffect8
        }

        .fx:hover .rT {
            animation: .1s ease-in-out .15s both changeColor8, .2s linear .4s both lightEffect8
        }

        .fx:hover .rB {
            animation: .1s ease-in-out .25s both changeColor8, .2s linear .4s both lightEffect8
        }

        .fx:hover .lB {
            animation: .1s ease-in-out .35s both changeColor8, .2s linear .4s both lightEffect8
        }

        .fx:hover .corner {
            transform: scale(1.25) rotate(45deg)
        }

        .fx:hover .clip {
            animation: .2s ease-in-out .55s both greenLight8;
            --color: #27c39f
        }

        @keyframes changeColor8 {
            from {
                background-color: #2781c3
            }

            to {
                background-color: #27c39f
            }
        }

        @keyframes lightEffect8 {
            from {
                box-shadow: 1px 1px 5px #27c39f
            }

            to {
                box-shadow: 0 0 2px #27c39f
            }
        }

        @keyframes greenLight8 {
            to {
                box-shadow: inset 0 0 32px #27c39f
            }
        }

        @keyframes leftArrow8 {
            from {
                transform: translate(0)
            }

            to {
                transform: translateX(10px)
            }
        }

        @keyframes rightArrow8 {
            from {
                transform: translate(0)
            }

            to {
                transform: translateX(-10px)
            }
        }

        .input-container {
            position: relative;
            width: 100%;
            max-width: 270px;
            margin: 14px 12px 22px 0
        }

        .input-container::after {
            content: "|";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #000;
            animation: blink .7s step-end infinite;
            pointer-events: none
        }

        .input {
            width: 100%;
            max-width: 270px;
            height: 60px;
            padding: 12px;
            font-size: 18px;
            font-family: "Courier New", monospace;
            color: #000;
            background-color: #fff;
            border: 4px solid #000;
            border-radius: 0;
            outline: none;
            transition: all .3s ease;
            box-shadow: 8px 8px 0 #000
        }

        .input::placeholder {
            color: #888
        }

        .input:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 #000
        }

        .input:focus {
            background-color: #010101;
            color: #fff;
            border-color: #d6d9dd;
            animation: shake .5s ease-in-out
        }

        .input:focus::placeholder {
            color: #fff
        }

        .input:not(:placeholder-shown) {
            animation: glitch 1s linear infinite;
            font-weight: bold;
            letter-spacing: 1px
        }

        @keyframes shake {
            0% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-5px) rotate(-5deg)
            }

            50% {
                transform: translateX(5px) rotate(5deg)
            }

            75% {
                transform: translateX(-5px) rotate(-5deg)
            }

            100% {
                transform: translateX(0)
            }
        }

        @keyframes glitch {

            0%,
            10%,
            27%,
            35%,
            50%,
            52%,
            72%,
            80%,
            100% {
                transform: none;
                opacity: 1
            }

            7% {
                transform: skew(-.5deg, -.9deg);
                opacity: .75
            }

            30% {
                transform: skew(.8deg, -.1deg);
                opacity: .75
            }

            55% {
                transform: skew(-1deg, .2deg);
                opacity: .75
            }

            75% {
                transform: skew(.4deg, 1deg);
                opacity: .75
            }
        }

        @keyframes blink {
            50% {
                opacity: 0
            }
        }

        body {

        }

        .wt-wrap {
            position: relative;
            height: 64px
        }

        .water-toggle {
            display: inline-block;
            position: absolute;
            right: 14px;
            top: 10px
        }

        .water-toggle input#toggle-wave {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 3;
            padding: 0;
            border: 0
        }

        .water-toggle .container {
            margin: -1rem;
            padding: 1rem;
            position: relative;
            z-index: 1;
            filter: url(#still-water);
            animation: wave 10s infinite ease-in-out;
            transition: 1s;
            display: block
        }

        .water-toggle:hover .container {
            filter: url(#water-rotate);
            transition: .5s;
            animation: wave 8s infinite ease-in-out
        }

        input#toggle-wave:checked~.container {
            animation: beeg-wave 3.5s infinite ease-in-out;
            scale: .75
        }

            position: relative;
            z-index: 5;
            font-size: 1rem;

            transition: 1s;
            box-shadow: inset 2px 3px 4px #d4f7fe25
        }

        .water-toggle:hover .water-button {
            text-shadow: 0 0 12px #49e1ffda;
            background: #13b0ff3d;

            padding: .65em 1.5em;

        }

        @keyframes wave {

            }

                margin: -10rem

            }

            "CSS: المشروع الختامي (متغيرات + دارك مود)": "كيف نعرّف متغير CSS؟¦--name: value¦var name = value¦$name: value؛؛ أين تُعرَّف المتغيرات العامة؟¦:root¦body فقط¦head؛؛ ماذا تفعل var(--bg)؟¦تقرأ قيمة المتغير¦تعرّف متغيرا¦تحذف متغيرا؛؛ ما فائدة transition؟¦تغيير ناعم¦تغيير اللون¦إخفاء العنصر؛؛ متى يعمل :hover؟¦عند وقوف الماوس على العنصر¦عند تحميل الصفحة¦عند إغلاقها"
        };
        L.forEach(l => {
            l.k = l.k || "js";
            const q = Q[l.t];
            if (q) l.q = l.q.concat(q.split("؛؛").map(x => {
                const a = x.split("¦");
                return [a[0].trim(), a.slice(1), 0]
            }))
        });
        L.sort((a, b) => ORD.indexOf(a.k) - ORD.indexOf(b.k));
        let S;
        try {
            S = JSON.parse(localStorage.getItem("dama2") || "null")
        } catch (e) {}
        if (!S) {
            let o = null;
            try {
                o = JSON.parse(localStorage.getItem("dama") || "null")
            } catch (e) {}
            S = {
                name: o && o.name ? o.name : "",
                done: 0,
                recs: []
            }
        }
        const save = () => {
            try {
                localStorage.setItem("dama2", JSON.stringify(S))
            } catch (e) {}
        };
        let ord = [],
            cur = null,
            step = 0,
            ex = {},
            pr = {},
            t0 = 0,
            tries = 0,
            fails = 0,
            sent = false;
        const $ = h => document.getElementById("app").innerHTML = h;
        const wa = m => "https://wa.me/" + PH + "?text=" + encodeURIComponent(m);
        const fmt = s => Math.floor(s / 60) + " د " + (s % 60) + " ث";

        function home() {
            cur = null;
            let h = `<h1><span>DAMA</span> code</h1><p class="mu">كورس HTML ثم CSS ثم JavaScript — الدرس التالي لا يُفتح إلا بعد إرسال تقريرك على واتساب.</p>`;
            if (!S.name) h += `<div class="card"><b>اسم الطالب</b><div class="input-container"><input class="input" id="nm" name="text" type="text" placeholder="اكتب اسمك"></div><div class="wt-wrap"><label class="water-toggle"><input type="checkbox" id="toggle-wave" onchange="var c=this;setTimeout(function(){if(!nm())c.checked=false},700)"><div class="container"><button class="water-button" type="button">كمل</button><svg style="position:absolute;width:0;height:0"><filter id="water-rotate"><feTurbulence result="turbulence" seed="2" numOctaves="2" baseFrequency="0.0075 0.0075" type="turbulence"></feTurbulence><feComponentTransfer><feFuncR type="table"><animateTransform repeatCount="indefinite" dur="10s" values="0.01;0.02;0.01" attributeName="transform"></animateTransform></feFuncR></feComponentTransfer><feDisplacementMap yChannelSelector="G" xChannelSelector="R" scale="17.5" in2="turbulence" in="SourceGraphic"></feDisplacementMap></filter><filter id="still-water"><feTurbulence result="turbulence" seed="2" numOctaves="2" baseFrequency="0.0075 0.0075" type="turbulence"></feTurbulence><feComponentTransfer><feFuncR type="table"><animateTransform repeatCount="indefinite" dur="10s" values="0.01;0.02;0.01" attributeName="transform"></animateTransform></feFuncR></feComponentTransfer><feDisplacementMap yChannelSelector="G" xChannelSelector="R" scale="12.5" in2="turbulence" in="SourceGraphic"></feDisplacementMap></filter></svg></div></label></div></div>`;
            else {
                h += `<div class="bar"><i style="width:${S.done/L.length*100}%"></i></div><p class="mu">أهلا ${S.name} — أنجزت ${S.done} من ${L.length}</p>`;
                L.forEach((l, i) => {
                    const o = i < S.done,
                        a = i == S.done;
                    if (!i || L[i - 1].k != l.k) h += `<h3>${GN[l.k]}</h3>`;
                    h += `<div class="card row"><div>${i+1}. ${l.t}<div class="mu">${o?"✅ مكتمل":a?"متاح الآن":"🔒 مقفل"}</div></div>${fx(o?"مراجعة":"ابدأ","open_("+i+")",a||o?"":"disabled")}</div>`
                });
                if (S.done >= L.length) h += `<div class="card"><b class="ok">🎉 أنهيت الكورس!</b><br><a href="${wa(final())}" target="_blank"><button>إعادة إرسال التقرير النهائي</button></a></div>`
            }
            $(h)
        }

        function nm() {
            const v = document.getElementById("nm").value.trim();
            if (v.split(/\s+/).length < 2) {
                alert("اكتب اسمك الثنائي على الأقل");
                return false
            }
            S.name = v;
            save();
            home();
            return true
        }
        const shuf = a => a.sort(() => Math.random() - .5);

        function open_(i) {
            cur = i;
            ord = L[i].q.map(q => shuf(q[1].map((_, j) => j)));
            step = 0;
            ex = {};
            pr = {};
            tries = 0;
            fails = 0;
            sent = false;
            draw()
        }

        function draw() {
            const l = L[cur],
                ss = ["الشرح", "الامتحان", "التطبيق", "الإرسال"];
            let h = `<button class="g" onclick="home()">← الرئيسية</button><h2>الدرس ${cur+1}: ${l.t}</h2><p class="mu">${ss.map((s,i)=>i==step?`<b>${s}</b>`:s).join(" ← ")}</p><div class="card">`;
            if (step == 0) h += l.x + tbl(E[l.t], T[l.t]) + `<p class="mu">الضغط على «التالي» يبدأ الامتحان ويبدأ العد.</p>${fx("التالي","go(1)")}`;
            if (step == 1) {
                h += `<p class="mu">الشروط: نجاح بـ 100٪ من الأسئلة، ولا يوجد حد للوقت (يُسجَّل وقتك فقط). كل محاولة خاطئة تُسجَّل وتُخصم من درجتك.</p>`;
                l.q.forEach((q, i) => {
                    h += `<p><b>${i+1}) ${esc(q[0])}</b></p>` + ord[i].map(j => {
                        const o = q[1][j];
                        return `<label class="l ${ex[i]===j?"s":""}"><input type="radio" style="width:auto" name="q${i}" ${ex[i]===j?"checked":""} onclick="ex[${i}]=${j};draw()"> ${esc(o)}</label>`
                    }).join("")
                });
                h += `${fx("تسليم","chkEx()")}<div id="msg"></div>`
            }
            if (step == 2) {
                h += `<p><b>المطلوب:</b> ${l.p}</p><p class="mu">الشروط (كلها إلزامية، ولا يوجد حد للوقت):</p><ul>${l.c.map(c=>`<li>${c[0]}</li>`).join("")}</ul><textarea id="code" placeholder="اكتب الكود هنا" oninput="pr.code=this.value">${pr.code||""}</textarea>${fx("تسليم","chkPr()")}<div id="msg"></div>`
            }
            if (step == 3) {
                const g = grade();
                h += `<p>وقت الامتحان: <b>${fmt(pr.et)}</b> — محاولات الامتحان: <b>${tries}</b><br>وقت التطبيق: <b>${fmt(pr.pt)}</b><br>درجة الامتحان: <b>${g.e}/40</b> — التطبيق: <b>${g.p}/60</b> — المجموع: <b>${g.t}/100</b></p><b>تقييمك لنفسك (1-5)</b><select id="rt"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select><b>ملاحظة (اختياري)</b><input id="nt"><p class="mu">سيفتح واتساب برسالة جاهزة، اضغط إرسال هناك.</p>${fx("إرسال","send()")}${sent?`<p class="ok">بعد الضغط على «إرسال» داخل واتساب أكد هنا:</p>${fx("التالي","fin()")}`:""}`
            }
            $(h + "</div>")
        }

        function fx(l, oc, x) {
            return '<button class="fx" ' + (x || "") + ' onclick="' + oc + '">' + l + '<div class="clip"><div class="corner lT"></div><div class="corner rB"></div><div class="corner rT"></div><div class="corner lB"></div></div><span class="arrow rA"></span><span class="arrow lA"></span></button>'
        }

        function go(s) {
            step = s;
            t0 = Date.now();
            draw()
        }

        function chkEx() {
            const l = L[cur];
            if (Object.keys(ex).length < l.q.length) return msg("أجب عن كل الأسئلة", "bad");
            const el = (Date.now() - t0) / 1e3;
            tries++;
            const w = l.q.filter((q, i) => ex[i] !== q[2]).length;
            if (w) {
                fails++;
                ex = {};
                msg("❌ " + w + " إجابات خاطئة. أعد المحاولة (المحاولات الخاطئة: " + fails + ")", "bad");
                setTimeout(draw, 1800);
                return
            }
            pr.et = Math.round((Date.now() - t0) / 1e3);
            go(2)
        }

        function chkPr() {
            const l = L[cur],
                code = pr.code || "",
                el = (Date.now() - t0) / 1e3;
            const bad = l.c.filter(c => !c[1].test(code));
            let out = [];
            if (code.split("\n").filter(x => x.trim()).length < 2) out.push("الكود أقصر من سطرين");
            if (!bal(code, l.k)) out.push("الكود غير متوازن: تأكد من إغلاق كل وسم أو قوس");
            bad.forEach(c => out.push("ناقص: " + c[0]));
            if (out.length) return msg("❌ مرفوض:<br>" + out.join("<br>"), "bad");
            pr.pt = Math.round(el);
            pr.bad = 0;
            go(3)
        }

        function bal(c, k) {
            if (k == "html") {
                const v = ["br", "img", "input", "meta", "hr", "link"],
                    st = [],
                    re = /<(\/?)([a-zA-Z0-9]+)[^>]*>/g;
                let m;
                while (m = re.exec(c)) {
                    const n = m[2].toLowerCase();
                    if (v.includes(n)) continue;
                    if (m[1]) {
                        if (st.pop() !== n) return false
                    } else st.push(n)
                }
                return !st.length
            }
            const st = [],
                pr = {
                    ")": "(",
                    "]": "[",
                    "}": "{"
                };
            let q = null;
            for (const ch of c) {
                if (q) {
                    if (ch == q) q = null;
                    continue
                }
                if ("\"'`".includes(ch)) {
                    q = ch;
                    continue
                }
                if ("([{".includes(ch)) st.push(ch);
                else if (pr[ch] && st.pop() !== pr[ch]) return false
            }
            return !st.length && !q
        }

        function grade() {
            const e = Math.max(0, 40 - fails * 10),
                p = 60;
            return {
                e,
                p,
                t: e + p
            }
        }

        function msg(m, c) {
            document.getElementById("msg").innerHTML = `<p class="${c}">${m}</p>`
        }

        function report() {
            const l = L[cur],
                g = grade(),
                code = pr.code || "";
            return `📚 DAMA code — تقرير الدرس ${cur+1}: ${l.t}\n👤 الطالب: ${S.name}\n⏱ وقت الامتحان: ${fmt(pr.et)} (محاولات خاطئة: ${fails})\n⏱ وقت التطبيق: ${fmt(pr.pt)}\n📝 درجة الامتحان: ${g.e}/40\n💻 درجة التطبيق: ${g.p}/60\n🏆 المجموع: ${g.t}/100 ${g.t>=PASS?"(ناجح)":"(راسب)"}\n⭐ تقييمي لنفسي: ${document.getElementById("rt").value}/5\n🗒 ملاحظة: ${document.getElementById("nt").value||"-"}\n\n📄 الكود الذي كتبته:\n${code}`
        }

        function final() {
            const t = S.recs.reduce((a, r) => a + r.t, 0);
            return `🎓 ${S.name} أنهى كورس DAMA code بالكامل!\nعدد الدروس: ${L.length}\nمتوسط الدرجات: ${Math.round(t/(S.recs.length||1))}/100`
        }

        function send() {
            const g = grade();
            if (g.t < PASS) return alert("درجتك أقل من " + PASS + "، أعد الدرس.");
            window.open(wa(report()), "_blank");
            sent = true;
            draw()
        }

        function fin() {
            const g = grade();
            if (cur == S.done) {
                S.recs.push({
                    t: g.t
                });
                S.done++;
                save();
                if (S.done >= L.length) {
                    window.open(wa(final()), "_blank")
                }
            }
            home()
        }

        function curTheme() {
            return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        }

        function tgl(cb) {
            const n = cb.checked ? "dark" : "light";
            document.documentElement.dataset.theme = n;
            try {
                localStorage.setItem("dama-theme", n)
            } catch (e) {}
        }
        try {
            const t = localStorage.getItem("dama-theme");
            if (t) document.documentElement.dataset.theme = t
        } catch (e) {}
        document.getElementById("tgc").checked = curTheme() == "dark";
        home();
    </script>
</body>

</html>
